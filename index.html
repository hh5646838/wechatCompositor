<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }

/* ===== 顶部导航 ===== */
.top-nav {
  background: #fff;
  border-bottom: 1px solid #e4e7ed;
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-left { display: flex; align-items: center; gap: 12px; }
.nav-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, #07c160, #10ad56);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(7,193,96,0.3);
}
.nav-title { font-size: 17px; font-weight: 700; color: #1a1a1a; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  object-fit: cover; border: 2px solid #e4e7ed;
  cursor: pointer;
}
.nav-link {
  padding: 6px 14px;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  background: #fff;
  transition: all 0.2s;
  color: #606266;
}
.nav-link:hover { border-color: #07c160; color: #07c160; }
.nav-follow {
  padding: 6px 18px;
  background: #07c160;
  color: #fff !important;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
}
.nav-follow:hover { background: #06a552; }

/* ===== 控制面板 ===== */
.control-panel {
  background: #fff;
  border-bottom: 1px solid #e4e7ed;
  padding: 14px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-end;
}
.control-group { display: flex; flex-direction: column; gap: 4px; }
.control-group label {
  font-size: 12px;
  color: #909399;
  font-weight: 500;
}
.control-group select,
.control-group input[type="color"],
.control-group input[type="number"] {
  padding: 6px 10px;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 13px;
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.control-group select:focus,
.control-group input:focus { border-color: #07c160; }
.control-group input[type="color"] {
  width: 38px; height: 32px; padding: 2px; cursor: pointer; border-radius: 6px;
}
.size-row { display: flex; gap: 8px; align-items: center; }
.size-row .control-group { min-width: 56px; }
.size-row .control-group input { width: 56px; text-align: center; }

/* 7 色快捷色板 */
.color-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatch {
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px #dcdfe6;
  transition: transform 0.15s, box-shadow 0.15s;
}
.swatch:hover { transform: scale(1.15); box-shadow: 0 0 0 2px #07c160; }
.swatch.active { box-shadow: 0 0 0 2px #07c160; transform: scale(1.1); }
.reset-color-btn {
  padding: 4px 10px; font-size: 12px; border: 1px solid #dcdfe6;
  border-radius: 4px; background: #fff; cursor: pointer; color: #909399;
  transition: all 0.2s;
}
.reset-color-btn:hover { border-color: #f56c6c; color: #f56c6c; }

.custom-css-group { flex: 1; min-width: 280px; }
.custom-css-group textarea {
  width: 100%;
  min-height: 56px;
  padding: 8px 10px;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 12px;
  font-family: "SFMono-Regular", Consolas, monospace;
  resize: vertical;
  outline: none;
  line-height: 1.5;
}
.custom-css-group textarea:focus { border-color: #07c160; }
.css-warning {
  font-size: 11px;
  color: #e6a23c;
  margin-top: 2px;
  line-height: 1.4;
}

/* ===== 双栏编辑器 ===== */
.editor-container {
  flex: 1;
  display: flex;
  gap: 0;
  min-height: 0;
  padding: 16px 24px;
}
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.editor-pane:first-child { margin-right: 8px; }
.pane-header {
  padding: 10px 16px;
  background: #fafafa;
  border-bottom: 1px solid #ebeef5;
  font-size: 13px;
  font-weight: 600;
  color: #606266;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.pane-header-right { display: flex; align-items: center; gap: 10px; }
.pane-note { font-size: 11px; color: #c0c4cc; font-weight: 400; }

/* 预览头部的复制按钮 */
.btn-copy-header {
  padding: 6px 18px;
  background: linear-gradient(135deg, #07c160, #10ad56);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(7,193,96,0.25);
}
.btn-copy-header:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(7,193,96,0.35); }
.btn-copy-header.copied { background: linear-gradient(135deg, #67c23a, #5daf34); }

#markdown-input {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  padding: 20px;
  font-size: 15px;
  line-height: 1.8;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  resize: none;
  background: #fff;
  color: #333;
}
.preview-wrapper {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
}
#preview { max-width: 100%; }

/* ===== 字数统计 ===== */
.word-count-bar {
  padding: 8px 16px;
  border-top: 1px solid #ebeef5;
  font-size: 13px;
  color: #909399;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fafafa;
}
.word-count-bar.warning {
  color: #e6a23c;
  font-weight: 600;
  background: #fdf6ec;
}
.word-count-tip { font-size: 12px; }

/* ===== 弹窗通用 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  max-width: 520px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-header {
  padding: 20px 24px 12px;
  font-size: 18px;
  font-weight: 700;
  color: #1a1a1a;
  border-bottom: 1px solid #f0f0f0;
}
.modal-body { padding: 16px 24px; font-size: 14px; line-height: 1.8; color: #555; white-space: pre-wrap; }
.modal-footer { padding: 12px 24px 20px; display: flex; justify-content: flex-end; }
.modal-close-btn {
  padding: 8px 28px;
  background: #f5f7fa;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.modal-close-btn:hover { background: #e8eaed; }

/* ===== 关注公众号弹窗 ===== */
.follow-modal .modal-box { max-width: 380px; text-align: center; overflow: hidden; }
.follow-qr {
  width: 200px; height: 200px;
  object-fit: contain;
  border-radius: 8px;
  margin: 8px auto 16px;
  display: block;
  border: 1px solid #eee;
  padding: 6px;
  background: #fff;
}
.follow-name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 0 24px;
}
.follow-name {
  font-size: 16px;
  font-weight: 700;
  color: #1a1a1a;
  background: #f5f7fa;
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px dashed #dcdfe6;
}
.btn-copy-name {
  padding: 6px 16px;
  background: #07c160;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.2s;
}
.btn-copy-name:hover { background: #06a552; }
.follow-tip { font-size: 13px; color: #909399; margin-bottom: 16px; padding: 0 24px; }

/* ===== 猫猫泪水弹窗 ===== */
.cat-popup .modal-box {
  max-width: 400px;
  text-align: center;
  overflow: hidden;
}
.cat-svg-wrap {
  padding: 28px 0 12px;
  background: linear-gradient(180deg, #fff5f5, #fff);
}
.cat-svg-wrap svg { width: 90px; height: 90px; }
.cat-title {
  font-size: 18px;
  font-weight: 700;
  color: #c41e3a;
  margin: 8px 0 12px;
}
.cat-message {
  font-size: 14px;
  color: #666;
  line-height: 1.8;
  padding: 0 24px;
  margin-bottom: 16px;
}
.cat-wechat-promo {
  margin: 0 24px 16px;
  padding: 16px;
  background: #fafafa;
  border-radius: 10px;
  border: 1px solid #f0f0f0;
}
.cat-qr {
  width: 140px;
  height: 140px;
  object-fit: contain;
  border-radius: 6px;
  margin: 0 auto 8px;
  display: block;
  background: #fff;
  padding: 4px;
  border: 1px solid #eee;
}
.cat-scan-tip {
  font-size: 12px;
  color: #909399;
  margin-top: 6px;
  margin-bottom: 10px;
}
.cat-name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.cat-wechat-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
}
.cat-copy-name-btn {
  padding: 4px 12px;
  font-size: 12px;
  background: #fff;
  border: 1px solid #07c160;
  color: #07c160;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.cat-copy-name-btn:hover { background: #07c160; color: #fff; }
.cat-footer {
  padding: 0 24px 20px;
}
.cat-close-btn {
  width: 100%;
  padding: 10px;
  background: #07c160;
  border: 1px solid #07c160;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: #fff;
  transition: all 0.2s;
}
.cat-close-btn:hover:not(:disabled) { background: #06a552; }
.cat-close-btn:disabled,
.cat-close-btn.counting {
  background: #c0c4cc;
  border-color: #c0c4cc;
  color: #fff;
  cursor: not-allowed;
  opacity: 0.7;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 响应式 ===== */
@media (max-width: 900px) {
  .editor-container { flex-direction: column; padding: 12px; }
  .editor-pane:first-child { margin-right: 0; margin-bottom: 12px; min-height: 300px; }
  .control-panel { padding: 12px; gap: 12px; }
  .top-nav { padding: 0 12px; }
  .nav-title { font-size: 14px; }
  .pane-note { display: none; }
}
</style>

  const $ = (id) => document.getElementById(id);
  const markdownInput = $("markdown-input");
  const preview = $("preview");
  const themeSelect = $("theme-select");

  const fontSelect = $("font-select");
  const customCss = $("custom-css");
  const copyBtn = $("copy-btn");
  const wordCount = $("word-count");
  const wordCountBar = $("word-count-bar");
  const wordCountTip = $("word-count-tip");
  const toast = $("toast");

  async function init() {
    try { copyCount = parseInt(localStorage.getItem("wechat_copy_count") || "0", 10); } catch(e) { copyCount = 0; }

    if (window.marked) {
      marked.setOptions({ breaks: true, gfm: true });
    }

    // 纯前端：直接使用内嵌配置，无需后端 API
    APP_CONFIG = EMBEDDED_CONFIG;
    applySiteConfig(APP_CONFIG.site);
    populateThemes(APP_CONFIG.themes);

    bindEvents();
    render();
  }

  function applySiteConfig(site) {
    if (!site) return;
    if (site.SITE_TITLE) {
      $("nav-title").textContent = site.SITE_TITLE;
      document.title = site.SITE_TITLE;
    }
    if (site.AVATAR_URL) {
      const avatar = $("nav-avatar");
      avatar.src = site.AVATAR_URL;
      avatar.style.display = "block";
      avatar.onerror = function() { this.style.display = "none"; };
    }
    if (site.HELP_DOC) {
      $("help-content").textContent = site.HELP_DOC;
    }
    // 关注弹窗配置
    if (site.WECHAT_QR) {
      $("follow-qr").src = site.WECHAT_QR;
    }
    if (site.WECHAT_NAME) {
      $("follow-name").textContent = site.WECHAT_NAME;
    }
    // JoJo 工具箱链接
    if (site.JOJO_TOOLBOX_URL) {
      const toolbox = $("nav-toolbox");
      toolbox.href = site.JOJO_TOOLBOX_URL;
      toolbox.style.display = "inline-block";
    }
  }

  function populateThemes(themes) {
    themeSelect.innerHTML = "";
    const keys = Object.keys(themes || {});
    if (keys.length === 0) {
      themeSelect.innerHTML = '<option value="">无可用主题</option>';
      return;
    }
    keys.forEach((key, idx) => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = key;
      themeSelect.appendChild(opt);
      if (idx === 0) currentThemeKey = key;
    });
    themeSelect.value = currentThemeKey;
  }

  function buildCSS() {
    let css = "";

    if (APP_CONFIG && APP_CONFIG.themes && currentThemeKey && APP_CONFIG.themes[currentThemeKey]) {
      css += APP_CONFIG.themes[currentThemeKey].css || "";
    }

    // 自定义主题色：替换主题 primary 色
    const useCustomColor = customColor.value && customColor.value !== "#07c160";
    if (useCustomColor && APP_CONFIG && APP_CONFIG.themes && currentThemeKey) {
      const theme = APP_CONFIG.themes[currentThemeKey];
      if (theme.primary) {
        css = css.split(theme.primary).join(customColor.value);
      }
    }

    // 字体覆盖
    const fontFamily = fontSelect.value;
    if (fontFamily) {
      css += `\n.content { font-family: ${fontFamily} !important; }\n`;
    }

    // 字号覆盖
    css += `\n.content { font-size: ${$("size-body").value}px !important; }\n`;
    css += `.content h1 { font-size: ${$("size-h1").value}px !important; }\n`;
    css += `.content h2 { font-size: ${$("size-h2").value}px !important; }\n`;
    css += `.content h3 { font-size: ${$("size-h3").value}px !important; }\n`;
    css += `.content h4 { font-size: ${$("size-h4").value}px !important; }\n`;

    // 用户自定义 CSS
    if (customCss.value.trim()) {
      css += "\n/* === 用户自定义 CSS === */\n" + customCss.value + "\n";
    }

    return css;
  }

  function render() {
    const md = markdownInput.value;
    updateWordCount(md);

    let html = "";
    if (window.marked && typeof marked.parse === "function") {
      html = marked.parse(md);
    } else {
      html = "<pre style='white-space:pre-wrap;'>" + escapeHtml(md) + "</pre>";
    }

    // 文章头部信息模块（字数+预计阅读时间）
    if ($("meta-toggle") && $("meta-toggle").checked) {
      const count = md.replace(/\s/g, "").length;
      const minutes = Math.max(1, Math.ceil(count / 400));
      html = `<div style="display:flex;align-items:center;gap:14px;padding:10px 16px;background:#f7f8fa;border-radius:6px;font-size:13px;color:#909399;margin-bottom:20px;border-left:3px solid #dcdfe6;">
        <span>全文 ${count} 字</span>
        <span style="color:#e4e7ed;">|</span>
        <span>预计阅读 ${minutes} 分钟</span>
      </div>` + html;
    }

    const css = buildCSS();
    preview.innerHTML = `<style>${css}</style>${html}`;
    window.__currentHtml = html;
    window.__currentCss = css;
  }

  function updateWordCount(md) {
    const count = md.replace(/\s/g, "").length;
    wordCount.textContent = `当前字数：${count} 字`;
    if (count > 1500) {
      wordCountBar.classList.add("warning");
      wordCountTip.textContent = "⚠ 已超过 1500 字黄金阅读字数，微信后台粘贴可能会有轻微卡顿，建议分段发布";
    } else {
      wordCountBar.classList.remove("warning");
      wordCountTip.textContent = "";
    }
  }

  async function copyRichText() {
    const html = window.__currentHtml || "";
    const css = window.__currentCss || "";
    if (!html.trim()) { showToast("内容为空，无法复制"); return; }

    let inlinedHtml = html;
    try {
      // 先包装在 .content 里，CSS 选择器才能匹配
      const wrapped = `<div class="content">${html}</div>`;
      inlinedHtml = inlineCSS(wrapped, css);
    } catch (err) {
      console.warn("CSS 内联失败：", err);
      inlinedHtml = `<div class="content">${html}</div>`;
    }

    const finalHtml = inlinedHtml;

    try {
      if (navigator.clipboard && window.ClipboardItem) {
        const blobHtml = new Blob([finalHtml], { type: "text/html" });
        const blobText = new Blob([stripHtml(finalHtml)], { type: "text/plain" });
        await navigator.clipboard.write([
          new ClipboardItem({ "text/html": blobHtml, "text/plain": blobText })
        ]);
      } else {
        fallbackCopy(finalHtml);
      }
      onCopySuccess();
    } catch (err) {
      console.error("复制失败：", err);
      try { fallbackCopy(finalHtml); onCopySuccess(); }
      catch (e2) { showToast("复制失败，请手动选择预览区复制"); }
    }
  }

  function fallbackCopy(html) {
    const container = document.createElement("div");
    container.innerHTML = html;
    container.style.position = "fixed";
    container.style.left = "-9999px";
    document.body.appendChild(container);
    const range = document.createRange();
    range.selectNodeContents(container);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("copy");
    sel.removeAllRanges();
    document.body.removeChild(container);
  }

  function onCopySuccess() {
    copyBtn.classList.add("copied");
    copyBtn.textContent = "✓ 已复制";
    setTimeout(() => {
      copyBtn.classList.remove("copied");
      copyBtn.textContent = "复制富文本";
    }, 2000);
    showToast("富文本已复制，直接粘贴到公众号后台即可");

    copyCount++;
    try { localStorage.setItem("wechat_copy_count", String(copyCount)); } catch(e) {}
    if (copyCount % 3 === 0) showCatPopup();
  }

  function showCatPopup() {
    const site = (APP_CONFIG && APP_CONFIG.site) || {};
    // 填充公众号二维码和名称
    const qr = $("cat-qr");
    if (site.WECHAT_QR) { qr.src = site.WECHAT_QR; qr.style.display = "block"; }
    else { qr.style.display = "none"; }
    $("cat-wechat-name").textContent = site.WECHAT_NAME || "公众号";
    $("cat-popup").classList.add("active");
    startCatCountdown();
  }

  function startCatCountdown() {
    if (catCountdownTimer) clearInterval(catCountdownTimer);
    const btn = $("cat-close-btn");
    let seconds = 3;
    btn.disabled = true;
    btn.classList.add("counting");
    btn.textContent = seconds + "秒后可关闭";
    catCountdownTimer = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        btn.textContent = seconds + "秒后可关闭";
      } else {
        clearInterval(catCountdownTimer);
        catCountdownTimer = null;
        btn.disabled = false;
        btn.classList.remove("counting");
        btn.textContent = "已知晓，关闭继续使用";
      }
    }, 1000);
  }

  // 复制公众号名称
  function copyWechatName() {
    const name = $("follow-name").textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(name).then(() => {
        showToast("公众号名称已复制");
      }).catch(() => {
        fallbackCopyText(name);
        showToast("公众号名称已复制");
      });
    } else {
      fallbackCopyText(name);
      showToast("公众号名称已复制");
    }
  }

  function fallbackCopyText(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function stripHtml(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent || div.innerText || "";
  }

  // ===== 本地 CSS 内联函数（不依赖外部 CDN）=====
  function parseCSS(css) {
    const rules = [];
    css = css.replace(/\/\*[\s\S]*?\*\//g, "");
    css = css.replace(/@[^{]*\{[\s\S]*?\}\s*\}/g, "");
    const blocks = css.split("}");
    for (let i = 0; i < blocks.length; i++) {
      const block = blocks[i].trim();
      if (!block) continue;
      const braceIdx = block.indexOf("{");
      if (braceIdx === -1) continue;
      const selectorPart = block.substring(0, braceIdx).trim();
      const declPart = block.substring(braceIdx + 1).trim();
      if (!selectorPart || !declPart) continue;
      if (selectorPart.startsWith("@")) continue;
      const selectors = selectorPart.split(",").map(s => s.trim()).filter(Boolean);
      selectors.forEach(sel => {
        rules.push({ selector: sel, declarations: declPart });
      });
    }
    return rules;
  }

  function inlineCSS(html, css) {
    const container = document.createElement("div");
    container.innerHTML = html;
    const rules = parseCSS(css);
    for (let i = 0; i < rules.length; i++) {
      const rule = rules[i];

      // 处理 ::before / ::after 伪元素：把 content 转成真实 span 插入 DOM
      const pseudoMatch = rule.selector.match(/^(.*?)::?(before|after)\s*$/i);
      if (pseudoMatch) {
        const baseSelector = pseudoMatch[1].trim();
        const pseudoType = pseudoMatch[2].toLowerCase();
        const contentMatch = rule.declarations.match(/content\s*:\s*["']([^"']*)["']/i);
        if (!contentMatch) continue;
        const contentText = contentMatch[1];
        const otherDecls = rule.declarations.replace(/content\s*:\s*[^;]+;?/i, "").trim();
        let elements;
        try { elements = container.querySelectorAll(baseSelector); } catch (e) { continue; }
        elements.forEach(el => {
          const span = document.createElement("span");
          span.textContent = contentText;
          if (otherDecls) span.setAttribute("style", otherDecls);
          if (pseudoType === "before") {
            el.insertBefore(span, el.firstChild);
          } else {
            el.appendChild(span);
          }
        });
        continue;
      }

      // 普通选择器
      let elements;
      try {
        elements = container.querySelectorAll(rule.selector);
      } catch (e) {
        continue;
      }
      elements.forEach(el => {
        const existing = el.getAttribute("style") || "";
        const newStyle = existing ? existing + "; " + rule.declarations : rule.declarations;
        el.setAttribute("style", newStyle);
      });
    }
    return container.innerHTML;
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2500);
  }

  function bindEvents() {
    let renderTimer = null;
    markdownInput.addEventListener("input", () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 150);
    });

    themeSelect.addEventListener("change", () => {
      currentThemeKey = themeSelect.value;
      render();
    });

    // 自定义颜色
    customColor.addEventListener("input", () => {
      updateSwatchActive();
      render();
    });

    // 7 色快捷色板
    document.querySelectorAll(".swatch").forEach(sw => {
      sw.addEventListener("click", () => {
        const color = sw.getAttribute("data-color");
        customColor.value = color;
        updateSwatchActive();
        render();
      });
    });

    $("reset-color").addEventListener("click", () => {
      customColor.value = "#07c160";
      updateSwatchActive();
      render();
    });

    fontSelect.addEventListener("change", render);
    ["size-h1","size-h2","size-h3","size-h4","size-body"].forEach(id => {
      $(id).addEventListener("input", render);
    });

    let cssTimer = null;
    customCss.addEventListener("input", () => {
      clearTimeout(cssTimer);
      cssTimer = setTimeout(render, 200);
    });

    // 文章头部信息开关
    $("meta-toggle").addEventListener("change", render);

    // 复制按钮（在预览头部）
    copyBtn.addEventListener("click", copyRichText);

    // 使用帮助
    $("nav-help").addEventListener("click", () => {
      $("help-modal").classList.add("active");
    });
    $("help-modal").addEventListener("click", (e) => {
      if (e.target.id === "help-modal") $("help-modal").classList.remove("active");
    });

    // 关注我 → 弹窗
    $("nav-follow").addEventListener("click", () => {
      $("follow-modal").classList.add("active");
    });
    $("follow-modal").addEventListener("click", (e) => {
      if (e.target.id === "follow-modal") $("follow-modal").classList.remove("active");
    });
    $("copy-name-btn").addEventListener("click", copyWechatName);

    // 猫猫弹窗 —— 必须点击按钮关闭，倒计时未结束不可关闭
    $("cat-close-btn").addEventListener("click", () => {
      if ($("cat-close-btn").disabled) return;
      $("cat-popup").classList.remove("active");
      if (catCountdownTimer) { clearInterval(catCountdownTimer); catCountdownTimer = null; }
    });
    $("cat-copy-name-btn").addEventListener("click", () => {
      const name = $("cat-wechat-name").textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(name).then(() => showToast("公众号名称已复制")).catch(() => { fallbackCopyText(name); showToast("公众号名称已复制"); });
      } else { fallbackCopyText(name); showToast("公众号名称已复制"); }
    });

    // ESC
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        $("help-modal").classList.remove("active");
        $("follow-modal").classList.remove("active");
      }
    });
  }

  function updateSwatchActive() {
    const current = customColor.value.toLowerCase();
    document.querySelectorAll(".swatch").forEach(sw => {
      if (sw.getAttribute("data-color").toLowerCase() === current) {
        sw.classList.add("active");
      } else {
        sw.classList.remove("active");
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
