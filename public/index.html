<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公众号 Markdown 一键排版工具</title>
<style>
/* ========== 全局重置与应用 UI 样式（非内容样式） ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }

/* ========== 顶部导航 ========== */
.top-nav {
  background: #fff;
  border-bottom: 1px solid #e4e7ed;
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-left { display: flex; align-items: center; gap: 12px; }
.nav-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #07c160, #10ad56);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 18px;
  flex-shrink: 0;
}
.nav-title { font-size: 17px; font-weight: 700; color: #1a1a1a; }
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  object-fit: cover; border: 2px solid #e4e7ed;
  cursor: pointer;
}
.nav-follow {
  padding: 6px 16px;
  background: #07c160;
  color: #fff !important;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.2s;
}
.nav-follow:hover { background: #06a552; }
.nav-help {
  padding: 6px 14px;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  background: #fff;
  transition: all 0.2s;
}
.nav-help:hover { border-color: #07c160; color: #07c160; }

/* ========== 控制面板 ========== */
.control-panel {
  background: #fff;
  border-bottom: 1px solid #e4e7ed;
  padding: 14px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-end;
}
.control-group { display: flex; flex-direction: column; gap: 4px; }
.control-group label {
  font-size: 12px;
  color: #909399;
  font-weight: 500;
}
.control-group select,
.control-group input[type="color"],
.control-group input[type="number"],
.control-group input[type="text"] {
  padding: 6px 10px;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 13px;
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.control-group select:focus,
.control-group input:focus { border-color: #07c160; }
.control-group input[type="color"] {
  width: 42px; height: 32px; padding: 2px; cursor: pointer;
}
.size-row { display: flex; gap: 8px; align-items: center; }
.size-row .control-group { min-width: 60px; }
.size-row .control-group input { width: 60px; text-align: center; }
.custom-css-group { flex: 1; min-width: 280px; }
.custom-css-group textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 12px;
  font-family: "SFMono-Regular", Consolas, monospace;
  resize: vertical;
  outline: none;
  line-height: 1.5;
}
.custom-css-group textarea:focus { border-color: #07c160; }
.css-warning {
  font-size: 11px;
  color: #e6a23c;
  margin-top: 2px;
  line-height: 1.4;
}

/* ========== 双栏编辑器 ========== */
.editor-container {
  flex: 1;
  display: flex;
  gap: 0;
  min-height: 0;
  padding: 16px 24px;
}
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.editor-pane:first-child { margin-right: 8px; }
.pane-header {
  padding: 10px 16px;
  background: #fafafa;
  border-bottom: 1px solid #ebeef5;
  font-size: 13px;
  font-weight: 600;
  color: #606266;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#markdown-input {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  padding: 20px;
  font-size: 15px;
  line-height: 1.8;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  resize: none;
  background: #fff;
  color: #333;
}
.preview-wrapper {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
}
#preview { max-width: 100%; }

/* ========== 字数统计 ========== */
.word-count-bar {
  padding: 8px 16px;
  border-top: 1px solid #ebeef5;
  font-size: 13px;
  color: #909399;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fafafa;
}
.word-count-bar.warning {
  color: #e6a23c;
  font-weight: 600;
  background: #fdf6ec;
}
.word-count-tip { font-size: 12px; }

/* ========== 底部操作栏 ========== */
.action-bar {
  padding: 16px 24px;
  background: #fff;
  border-top: 1px solid #e4e7ed;
  display: flex;
  justify-content: center;
  gap: 12px;
}
.btn-copy {
  padding: 12px 48px;
  background: linear-gradient(135deg, #07c160, #10ad56);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(7,193,96,0.3);
}
.btn-copy:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(7,193,96,0.4); }
.btn-copy:active { transform: translateY(0); }
.btn-copy.copied { background: linear-gradient(135deg, #67c23a, #5daf34); }

/* ========== 弹窗通用 ========== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  max-width: 520px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-header {
  padding: 20px 24px 12px;
  font-size: 18px;
  font-weight: 700;
  color: #1a1a1a;
  border-bottom: 1px solid #f0f0f0;
}
.modal-body { padding: 16px 24px; font-size: 14px; line-height: 1.8; color: #555; white-space: pre-wrap; }
.modal-footer { padding: 12px 24px 20px; display: flex; justify-content: flex-end; }
.modal-close-btn {
  padding: 8px 28px;
  background: #f5f7fa;
  border: 1px solid #dcdfe6;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.modal-close-btn:hover { background: #e8eaed; }

/* ========== 猫猫泪水弹窗 ========== */
.cat-popup .modal-box {
  max-width: 400px;
  text-align: center;
  overflow: hidden;
}
.cat-svg-wrap {
  padding: 28px 0 12px;
  background: linear-gradient(180deg, #fff5f5, #fff);
}
.cat-svg-wrap svg { width: 90px; height: 90px; }
.cat-title {
  font-size: 18px;
  font-weight: 700;
  color: #c41e3a;
  margin: 8px 0 12px;
}
.cat-message {
  font-size: 14px;
  color: #666;
  line-height: 1.8;
  padding: 0 24px;
  margin-bottom: 16px;
}
.cat-article {
  margin: 0 24px 16px;
  padding: 16px;
  background: #fafafa;
  border-radius: 10px;
  border: 1px solid #f0f0f0;
}
.cat-article-title {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 12px;
  line-height: 1.5;
}
.cat-article-qr {
  width: 120px;
  height: 120px;
  object-fit: contain;
  border-radius: 6px;
  margin: 0 auto 10px;
  display: block;
  background: #fff;
  padding: 4px;
  border: 1px solid #eee;
}
.cat-article-link {
  display: inline-block;
  padding: 6px 20px;
  background: #07c160;
  color: #fff !important;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
}
.cat-footer {
  padding: 0 24px 20px;
}
.cat-close-btn {
  width: 100%;
  padding: 10px;
  background: #f5f7fa;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  color: #909399;
  transition: all 0.2s;
}
.cat-close-btn:hover { background: #e8eaed; color: #606266; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 响应式 ========== */
@media (max-width: 900px) {
  .editor-container { flex-direction: column; padding: 12px; }
  .editor-pane:first-child { margin-right: 0; margin-bottom: 12px; min-height: 300px; }
  .control-panel { padding: 12px; gap: 12px; }
  .top-nav { padding: 0 12px; }
  .nav-title { font-size: 14px; }
}
</style>

<script>
(function() {
  "use strict";

  // ========== 全局状态 ==========
  let APP_CONFIG = null;       // /api/config 返回的完整配置
  let currentThemeKey = null;  // 当前选中的主题 key
  let copyCount = 0;           // 累计复制次数（从 localStorage 读取）

  // DOM 引用
  const $ = (id) => document.getElementById(id);
  const markdownInput = $("markdown-input");
  const preview = $("preview");
  const themeSelect = $("theme-select");
  const customColor = $("custom-color");
  const fontSelect = $("font-select");
  const customCss = $("custom-css");
  const copyBtn = $("copy-btn");
  const wordCount = $("word-count");
  const wordCountBar = $("word-count-bar");
  const wordCountTip = $("word-count-tip");
  const toast = $("toast");

  // ========== 初始化：拉取后端配置 ==========
  async function init() {
    // 读取复制次数
    try {
      copyCount = parseInt(localStorage.getItem("wechat_copy_count") || "0", 10);
    } catch(e) { copyCount = 0; }

    // 配置 marked
    if (window.marked) {
      marked.setOptions({
        breaks: true,
        gfm: true
      });
    }

    // 拉取 /api/config
    try {
      const resp = await fetch("/api/config", { cache: "no-cache" });
      if (resp.ok) {
        APP_CONFIG = await resp.json();
        applySiteConfig(APP_CONFIG.site);
        populateThemes(APP_CONFIG.themes);
      } else {
        throw new Error("HTTP " + resp.status);
      }
    } catch (err) {
      console.warn("加载 /api/config 失败，使用默认配置：", err);
      useDefaultConfig();
    }

    // 绑定事件
    bindEvents();

    // 首次渲染
    render();
  }

  // ========== 应用站点配置到导航 ==========
  function applySiteConfig(site) {
    if (!site) return;
    if (site.SITE_TITLE) {
      $("nav-title").textContent = site.SITE_TITLE;
      document.title = site.SITE_TITLE;
    }
    if (site.AVATAR_URL) {
      const avatar = $("nav-avatar");
      avatar.src = site.AVATAR_URL;
      avatar.style.display = "block";
      avatar.onerror = function() { this.style.display = "none"; };
    }
    if (site.FOLLOW_LINK) {
      $("nav-follow").href = site.FOLLOW_LINK;
    }
    if (site.HELP_DOC) {
      $("help-content").textContent = site.HELP_DOC;
    }
  }

  // ========== 兜底默认配置（API 不可用时） ==========
  function useDefaultConfig() {
    applySiteConfig({
      SITE_TITLE: "公众号 Markdown 一键排版工具",
      HELP_DOC: "使用帮助：左侧输入 Markdown，右侧实时预览，点击复制富文本粘贴到公众号后台。"
    });
    populateThemes({
      "简约黑": { primary: "#2c2c2c", css: ".content{color:#333;font-size:16px;line-height:1.8;}" }
    });
  }

  // ========== 填充主题下拉 ==========
  function populateThemes(themes) {
    themeSelect.innerHTML = "";
    const keys = Object.keys(themes || {});
    if (keys.length === 0) {
      themeSelect.innerHTML = '<option value="">无可用主题</option>';
      return;
    }
    keys.forEach((key, idx) => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = key;
      themeSelect.appendChild(opt);
      if (idx === 0) currentThemeKey = key;
    });
    themeSelect.value = currentThemeKey;
  }

  // ========== 构建完整 CSS（主题 + 自定义覆盖） ==========
  function buildCSS() {
    let css = "";

    // 1. 主题基础 CSS
    if (APP_CONFIG && APP_CONFIG.themes && currentThemeKey && APP_CONFIG.themes[currentThemeKey]) {
      css += APP_CONFIG.themes[currentThemeKey].css || "";
    }

    // 2. 自定义主题色覆盖（替换主题 primary 色）
    const useCustomColor = customColor.value && customColor.value !== "#07c160";
    if (useCustomColor && APP_CONFIG && APP_CONFIG.themes && currentThemeKey) {
      const theme = APP_CONFIG.themes[currentThemeKey];
      if (theme.primary) {
        // 全局替换主题 primary 色为自定义色
        css = css.split(theme.primary).join(customColor.value);
      }
    }

    // 3. 正文字体覆盖
    const fontFamily = fontSelect.value;
    if (fontFamily) {
      css += `\n.content { font-family: ${fontFamily} !important; }\n`;
    }

    // 4. 字号覆盖
    const h1 = $("size-h1").value, h2 = $("size-h2").value;
    const h3 = $("size-h3").value, h4 = $("size-h4").value;
    const body = $("size-body").value;
    css += `\n.content { font-size: ${body}px !important; }\n`;
    css += `.content h1 { font-size: ${h1}px !important; }\n`;
    css += `.content h2 { font-size: ${h2}px !important; }\n`;
    css += `.content h3 { font-size: ${h3}px !important; }\n`;
    css += `.content h4 { font-size: ${h4}px !important; }\n`;

    // 5. 用户自定义 CSS
    if (customCss.value.trim()) {
      css += "\n/* === 用户自定义 CSS === */\n" + customCss.value + "\n";
    }

    return css;
  }

  // ========== Markdown → HTML 渲染 ==========
  function render() {
    const md = markdownInput.value;

    // 字数统计
    updateWordCount(md);

    // Markdown 转 HTML
    let html = "";
    if (window.marked && typeof marked.parse === "function") {
      html = marked.parse(md);
    } else {
      // marked 未加载时的兜底
      html = "<pre style='white-space:pre-wrap;'>" + escapeHtml(md) + "</pre>";
    }

    const css = buildCSS();

    // 预览：注入 style + HTML（不做内联，预览更清晰）
    preview.innerHTML = `<style>${css}</style>${html}`;

    // 保存当前 html 和 css 供复制使用
    window.__currentHtml = html;
    window.__currentCss = css;
  }

  // ========== 字数统计 ==========
  function updateWordCount(md) {
    // 去除空白字符后计数（中英文统一按字符计）
    const count = md.replace(/\s/g, "").length;
    wordCount.textContent = `当前字数：${count} 字`;

    if (count > 1500) {
      wordCountBar.classList.add("warning");
      wordCountTip.textContent = "⚠ 已超过 1500 字黄金阅读字数，微信后台粘贴可能会有轻微卡顿，建议分段发布";
    } else {
      wordCountBar.classList.remove("warning");
      wordCountTip.textContent = "";
    }
  }

  // ========== 复制富文本 ==========
  async function copyRichText() {
    const html = window.__currentHtml || "";
    const css = window.__currentCss || "";

    if (!html.trim()) {
      showToast("内容为空，无法复制");
      return;
    }

    // 使用 Juice 做 CSS 内联
    let inlinedHtml = html;
    if (window.juice && typeof juice.inlineContent === "function") {
      try {
        inlinedHtml = juice.inlineContent(html, css, {
          inlinePseudoElements: false,
          preserveImportant: true,
          removeStyleTags: true
        });
      } catch (err) {
        console.warn("Juice 内联失败，使用原始 HTML：", err);
      }
    }

    // 包装在 content div 中
    const finalHtml = `<div class="content">${inlinedHtml}</div>`;

    // 写入剪贴板（富文本 + 纯文本兜底）
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        const blobHtml = new Blob([finalHtml], { type: "text/html" });
        const blobText = new Blob([stripHtml(finalHtml)], { type: "text/plain" });
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/html": blobHtml,
            "text/plain": blobText
          })
        ]);
      } else {
        // 兜底：execCommand
        fallbackCopy(finalHtml);
      }
      onCopySuccess();
    } catch (err) {
      console.error("复制失败：", err);
      // 尝试兜底
      try {
        fallbackCopy(finalHtml);
        onCopySuccess();
      } catch (e2) {
        showToast("复制失败，请手动选择预览区复制");
      }
    }
  }

  // 兜底复制方案
  function fallbackCopy(html) {
    const container = document.createElement("div");
    container.innerHTML = html;
    container.style.position = "fixed";
    container.style.left = "-9999px";
    document.body.appendChild(container);
    const range = document.createRange();
    range.selectNodeContents(container);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("copy");
    sel.removeAllRanges();
    document.body.removeChild(container);
  }

  // 复制成功后的处理
  function onCopySuccess() {
    // 按钮反馈
    copyBtn.classList.add("copied");
    copyBtn.textContent = "✓ 已复制，去公众号粘贴吧";
    setTimeout(() => {
      copyBtn.classList.remove("copied");
      copyBtn.textContent = "复制富文本到公众号";
    }, 2000);

    showToast("富文本已复制，直接粘贴到公众号后台即可");

    // 累计复制次数
    copyCount++;
    try {
      localStorage.setItem("wechat_copy_count", String(copyCount));
    } catch(e) {}

    // 每 3 次触发猫猫弹窗
    if (copyCount % 3 === 0) {
      showCatPopup();
    }
  }

  // ========== 猫猫泪水弹窗 ==========
  function showCatPopup() {
    const articles = (APP_CONFIG && APP_CONFIG.articles) || [];
    const articleBox = $("cat-article");

    if (articles.length === 0) {
      articleBox.innerHTML = '<div style="color:#999;font-size:13px;">暂无推荐文章</div>';
    } else {
      const article = articles[Math.floor(Math.random() * articles.length)];
      articleBox.innerHTML = `
        <div class="cat-article-title">${escapeHtml(article.title || "推荐文章")}</div>
        ${article.qr_code ? `<img class="cat-article-qr" src="${escapeAttr(article.qr_code)}" alt="文章二维码" referrerpolicy="no-referrer">` : ""}
        <br>
        ${article.url ? `<a class="cat-article-link" href="${escapeAttr(article.url)}" target="_blank" rel="noopener">阅读原文</a>` : ""}
      `;
    }

    $("cat-popup").classList.add("active");
  }

  // ========== 工具函数 ==========
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function stripHtml(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent || div.innerText || "";
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2500);
  }

  // ========== 事件绑定 ==========
  function bindEvents() {
    // 输入实时渲染（防抖）
    let renderTimer = null;
    markdownInput.addEventListener("input", () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 150);
    });

    // 主题切换
    themeSelect.addEventListener("change", () => {
      currentThemeKey = themeSelect.value;
      render();
    });

    // 自定义颜色
    customColor.addEventListener("input", render);
    $("reset-color").addEventListener("click", () => {
      customColor.value = "#07c160";
      render();
    });

    // 字体 & 字号
    fontSelect.addEventListener("change", render);
    ["size-h1","size-h2","size-h3","size-h4","size-body"].forEach(id => {
      $(id).addEventListener("input", render);
    });

    // 自定义 CSS
    let cssTimer = null;
    customCss.addEventListener("input", () => {
      clearTimeout(cssTimer);
      cssTimer = setTimeout(render, 200);
    });

    // 复制按钮
    copyBtn.addEventListener("click", copyRichText);

    // 帮助弹窗
    $("nav-help").addEventListener("click", () => {
      $("help-modal").classList.add("active");
    });
    $("help-modal").addEventListener("click", (e) => {
      if (e.target.id === "help-modal") $("help-modal").classList.remove("active");
    });

    // 猫猫弹窗关闭
    $("cat-close-btn").addEventListener("click", () => {
      $("cat-popup").classList.remove("active");
    });
    $("cat-popup").addEventListener("click", (e) => {
      if (e.target.id === "cat-popup") $("cat-popup").classList.remove("active");
    });

    // ESC 关闭弹窗
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        $("help-modal").classList.remove("active");
        $("cat-popup").classList.remove("active");
      }
    });
  }

  // ========== 启动 ==========
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
